name: package-build-publish
run-name: package build and publish

on:
  push:
    branches: [main]
    paths:
      - 'overlay-*/usr/local/bin/of-*'
      - 'overlay-*/usr/local/bin/readlightsensor'
      - 'overlay-*/boot/backlight.txt'
      - 'overlay-*/boot/settings/**'
      - 'overlay-*/usr/local/sbin/of-*'
      - 'overlay-*/usr/share/kernel/**'
      - 'overlay-*/usr/lib/firmware/updates/**'
      - 'overlay-*/usr/lib/udev/rules.d/**'
      - 'overlay-*/usr/lib/udev/hwdb.d/**'
      - 'overlay-*/usr/lib/openframe/**'
      - 'overlay-*/usr/share/initramfs-tools/**'
      - 'overlay-*/usr/lib/systemd/system/**'
      - 'overlay-*/usr/lib/sysctl.d/**'
      - 'overlay-*/usr/lib/systemd/timesyncd.conf.d/**'
      - 'overlay-*/etc/dpkg/dpkg.cfg.d/openframe-*'
      - 'overlay-*/etc/apt/apt.conf.d/50openframe-*'
      - 'overlay-*/etc/apt/apt.conf.d/52openframe-*'
      - 'overlay-*/etc/sensors.d/openframe.conf'
      - 'overlay-*/usr/share/keyrings/**'
      - 'package/**'
      - '.github/workflows/package.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: write   # the testing issue (ci/testing-issue.sh)

concurrency:
  group: build-package
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0    # the version counts this month's commits

      - name: Install tools
        run: sudo apt-get install -y apt-utils dpkg-dev

      # OpenFrame Flash's firmware step against a stand-in updater: never carrying on or
      # stopping once a try hasn't verified, and the updater's dumps kept from filling /tmp.
      # (Run with every build of the package; tests/ isn't a trigger, as it isn't in the
      # package's version: a change there alone would rebuild the version units have.)
      - name: Test the flash's firmware step
        run: bash tests/test_flash_firmware.sh

      # Its backup= setting, and a stick in use as a system: the firmware alone backed up
      # with backup=no, the units' folders on the stick's own system without OF-BACKUP, and
      # its own system started rather than the panel held when there's nothing to do.
      - name: Test the flash's backups
        run: bash tests/test_flash_backup.sh

      # ssh-settings, which applies OF-BOOT/settings/ssh.txt: the password set and then
      # emptied in the file, the keys in a block of their own in authorized_keys. It needs
      # root and a user called of, so it runs in a Debian Trixie container of its own.
      - name: Test the SSH settings
        run: bash tests/test_ssh_settings.sh

      # of-update, the automatic updates, against stand-ins for apt-get, unattended-upgrade and
      # systemctl: catching up only when behind, downloads before installing, failures kept,
      # and a restart that waits for an update being installed.
      - name: Test the automatic updates
        run: bash tests/test_of_update.sh

      # test-settings, which applies OF-BOOT/settings/test.txt: testing=yes adds the testing
      # suites (a test unit), anything else takes them away.
      - name: Test the test unit setting
        run: bash tests/test_test_settings.sh

      # ci/apt-suite.sh, which every publish and promote here uses: a publish reaches test
      # units only, promote reaches everyone.
      - name: Test the testing and released suites
        run: bash tests/test_apt_suite.sh

      - name: Ensure repo branch exists
        run: |
          git fetch origin repo:refs/remotes/origin/repo 2>/dev/null || \
            git push origin HEAD:repo

      - name: Checkout repo branch
        uses: actions/checkout@v7
        with:
          ref: repo
          path: apt-repo

      # The OpenFrame apt repositories are signed with one key (APT_SIGNING_KEY_OPENFRAME in
      # each repository), the one the package ships in usr/share/keyrings. Until 2026-11 this
      # repository had its own (APT_SIGNING_KEY); while systems move over, the Release is
      # signed with both, so systems that know either key accept it. Every secret key imported signs. A
      # package that ships a key this run doesn't sign with is refused: units that installed
      # it would no longer accept this repository.
      - name: Import GPG signing keys
        env:
          KEY: ${{ secrets.APT_SIGNING_KEY }}
          KEY_NEW: ${{ secrets.APT_SIGNING_KEY_OPENFRAME }}
        run: |
          echo "${KEY}" | gpg --batch --import
          [ -z "${KEY_NEW}" ] || echo "${KEY_NEW}" | gpg --batch --import
          SIGNERS=$(gpg --batch --with-colons --list-secret-keys | awk -F: '/^sec/ { s = 1; next } s && /^fpr/ { print $10; s = 0 }')
          echo "Signing with: ${SIGNERS}"
          for k in overlay-*/usr/share/keyrings/openframe-apt.gpg; do
            [ -f "$k" ] || continue
            SHIPPED=$(gpg --batch --with-colons --show-keys "$k" | awk -F: '/^pub/ { s = 1; next } s && /^fpr/ { print $10; s = 0 }')
            for f in ${SHIPPED}; do
              echo "${SIGNERS}" | grep -qx "$f" || { echo "$k holds $f, which this run doesn't sign with: not publishing."; exit 1; }
            done
            echo "PUBLISH_KEY=${SHIPPED}" >> $GITHUB_ENV
          done
          echo "SIGN_ARGS=$(for f in ${SIGNERS}; do printf -- '--local-user %s! ' "$f"; done)" >> $GITHUB_ENV

      - name: Build packages and apt repository
        run: |
          for overlay_dir in overlay-*/; do
            codename=$(basename "${overlay_dir}" | sed 's/overlay-[^-]*-//')

            # year.month.N (see package/version.sh, which the image build uses too).
            version=$(bash package/version.sh "${overlay_dir}")
            PKG="openframe-scripts_${version#*:}_all"

            mkdir -p "${PKG}/DEBIAN" "${PKG}/usr/local/bin" "${PKG}/usr/local/sbin"
            cp "${overlay_dir}usr/local/bin/of-"* "${PKG}/usr/local/bin/" 2>/dev/null || true
            cp "${overlay_dir}usr/local/sbin/of-"* "${PKG}/usr/local/sbin/" 2>/dev/null || true
            chmod 755 "${PKG}/usr/local/bin/"of-* "${PKG}/usr/local/sbin/"of-*
            # readlightsensor: reads the light sensor's kernel driver. It replaces Andrew de
            # Quincey's tool, which older images had at this path.
            if [ -f "${overlay_dir}usr/local/bin/readlightsensor" ]; then
              install -m 755 "${overlay_dir}usr/local/bin/readlightsensor" "${PKG}/usr/local/bin/"
            fi

            # Kernel hooks: the kernel package runs /usr/share/kernel/*.d as well as /etc/kernel/*.d.
            mkdir -p "${PKG}/usr/share/kernel/preinst.d" "${PKG}/usr/share/kernel/postinst.d"
            cp "${overlay_dir}usr/share/kernel/preinst.d/"* "${PKG}/usr/share/kernel/preinst.d/"
            cp "${overlay_dir}usr/share/kernel/postinst.d/"* "${PKG}/usr/share/kernel/postinst.d/"
            chmod 755 "${PKG}/usr/share/kernel/preinst.d/"* "${PKG}/usr/share/kernel/postinst.d/"*

            # Firmware the built-in drivers list but Debian doesn't ship yet (without it, every
            # initramfs rebuild warns "Possible missing firmware"), and the brcmsmac firmware
            # for the OpenFrame 2's BCM43225 Wi-Fi (96 KB, where Debian's firmware-brcm80211 is
            # 18 MB), each with its licence. The updates directory doesn't clash with Debian's
            # firmware packages.
            if [ -d "${overlay_dir}usr/lib/firmware/updates" ]; then
              mkdir -p "${PKG}/usr/lib/firmware"
              cp -R "${overlay_dir}usr/lib/firmware/updates" "${PKG}/usr/lib/firmware/"
              find "${PKG}/usr/lib/firmware" -type d -exec chmod 755 {} +
              find "${PKG}/usr/lib/firmware" -type f -exec chmod 644 {} +
            fi

            # udev rules the scripts rely on (70-of-eth0-up.rules runs of-netplan --early).
            if [ -d "${overlay_dir}usr/lib/udev/rules.d" ]; then
              mkdir -p "${PKG}/usr/lib/udev/rules.d"
              install -m 644 "${overlay_dir}usr/lib/udev/rules.d/"*.rules "${PKG}/usr/lib/udev/rules.d/"
            fi

            # udev hardware database entries (the touchscreen's calibration). udev's own
            # trigger rebuilds hwdb.bin when a package changes them.
            if [ -d "${overlay_dir}usr/lib/udev/hwdb.d" ]; then
              mkdir -p "${PKG}/usr/lib/udev/hwdb.d"
              install -m 644 "${overlay_dir}usr/lib/udev/hwdb.d/"*.hwdb "${PKG}/usr/lib/udev/hwdb.d/"
            fi

            # The key the OpenFrame apt repositories are signed with (the postinst keeps
            # each repository's keyring in /etc/apt/keyrings to it).
            if [ -d "${overlay_dir}usr/share/keyrings" ]; then
              mkdir -p "${PKG}/usr/share/keyrings"
              install -m 644 "${overlay_dir}usr/share/keyrings/"*.gpg "${PKG}/usr/share/keyrings/"
            fi

            # BlwMac.efi, which of-bootnsh copies to /boot on BirdsLikeWires firmware.
            if [ -d "${overlay_dir}usr/lib/openframe" ]; then
              mkdir -p "${PKG}/usr/lib/openframe"
              for f in "${overlay_dir}usr/lib/openframe/"*; do
                if [ -d "$f" ]; then
                  # A folder of its own, one level deep: flash/ (OpenFrame Flash).
                  mkdir -p "${PKG}/usr/lib/openframe/${f##*/}"
                  for g in "$f"/*; do
                    [ -x "$g" ] && mode=755 || mode=644
                    install -m "$mode" "$g" "${PKG}/usr/lib/openframe/${f##*/}/"
                  done
                  continue
                fi
                [ -x "$f" ] && mode=755 || mode=644
                install -m "$mode" "$f" "${PKG}/usr/lib/openframe/"
              done
            fi

            # initramfs-tools settings for a small initrd: only the modules the root
            # filesystem needs (MODULES=list), and no udev hardware database. The trigger
            # has initramfs-tools rebuild the initrd once the package is installed.
            if [ -d "${overlay_dir}usr/share/initramfs-tools" ]; then
              mkdir -p "${PKG}/usr/share/initramfs-tools"
              cp -R "${overlay_dir}usr/share/initramfs-tools/." "${PKG}/usr/share/initramfs-tools/"
              find "${PKG}/usr/share/initramfs-tools" -type d -exec chmod 755 {} +
              find "${PKG}/usr/share/initramfs-tools" -type f -exec chmod 644 {} +
              chmod 755 "${PKG}/usr/share/initramfs-tools/hooks/"*
              install -m 644 package/triggers "${PKG}/DEBIAN/triggers"
            fi

            # Power-cut hardening: the service that finishes interrupted package operations,
            # a shorter writeback delay, and the dpkg hook that makes the read-only /boot
            # writable while dpkg runs (a conffile, so local changes are kept).
            if [ -d "${overlay_dir}usr/lib/systemd/system" ]; then
              mkdir -p "${PKG}/usr/lib/systemd/system"
              install -m 644 "${overlay_dir}usr/lib/systemd/system/"*.service "${PKG}/usr/lib/systemd/system/"
              # and their timers (of-update's)
              for timer in "${overlay_dir}usr/lib/systemd/system/"*.timer; do
                [ -f "$timer" ] && install -m 644 "$timer" "${PKG}/usr/lib/systemd/system/"
              done
              # Drop-ins for units other things create (xinit.service.d, ...).
              for dropin in "${overlay_dir}usr/lib/systemd/system/"*.service.d; do
                [ -d "$dropin" ] || continue
                mkdir -p "${PKG}/usr/lib/systemd/system/${dropin##*/}"
                install -m 644 "$dropin/"*.conf "${PKG}/usr/lib/systemd/system/${dropin##*/}/"
              done
            fi
            if [ -d "${overlay_dir}usr/lib/systemd/timesyncd.conf.d" ]; then
              mkdir -p "${PKG}/usr/lib/systemd/timesyncd.conf.d"
              install -m 644 "${overlay_dir}usr/lib/systemd/timesyncd.conf.d/"*.conf "${PKG}/usr/lib/systemd/timesyncd.conf.d/"
            fi
            if [ -d "${overlay_dir}usr/lib/sysctl.d" ]; then
              mkdir -p "${PKG}/usr/lib/sysctl.d"
              install -m 644 "${overlay_dir}usr/lib/sysctl.d/"*.conf "${PKG}/usr/lib/sysctl.d/"
            fi
            # dpkg, apt and lm-sensors settings, as conffiles so local changes are kept: the
            # /boot hook (openframe-boot), no translated messages (openframe-nolocale), no
            # firmware for drivers our kernel doesn't build (openframe-unused-firmware), apt's
            # small lists and caches (50openframe-slim), automatic updates (52openframe-updates),
            # and names for the temperature readings (sensors.d/openframe.conf). Images get the
            # same files from the overlay, so dpkg finds them identical and doesn't ask.
            : > "${PKG}/DEBIAN/conffiles"
            for conf in etc/dpkg/dpkg.cfg.d/openframe-boot etc/dpkg/dpkg.cfg.d/openframe-nolocale \
                        etc/dpkg/dpkg.cfg.d/openframe-unused-firmware \
                        etc/apt/apt.conf.d/50openframe-slim etc/apt/apt.conf.d/52openframe-updates \
                        etc/sensors.d/openframe.conf; do
              [ -f "${overlay_dir}${conf}" ] || continue
              mkdir -p "${PKG}/${conf%/*}"
              install -m 644 "${overlay_dir}${conf}" "${PKG}/${conf}"
              echo "/${conf}" >> "${PKG}/DEBIAN/conffiles"
            done

            # The settings files new images have in the boot volume's settings folder, which
            # the postinst and of-netplan put there on older systems.
            for f in "${overlay_dir}"boot/settings/*.txt; do
              [ -f "$f" ] || continue
              mkdir -p "${PKG}/usr/lib/openframe/settings"
              install -m 644 "$f" "${PKG}/usr/lib/openframe/settings/${f##*/}"
            done

            install -m 755 package/postinst "${PKG}/DEBIAN/postinst"
            # The preinst moves Debian's plymouth initramfs hook aside for ours (a dpkg
            # diversion), and the postrm puts it back.
            install -m 755 package/preinst "${PKG}/DEBIAN/preinst"
            install -m 755 package/postrm "${PKG}/DEBIAN/postrm"

            printf 'Package: openframe-scripts\nVersion: %s\nArchitecture: all\nSection: admin\nPriority: optional\nMaintainer: OpenFrame <andy@dvsn.net>\nDepends: bash, dosfstools, e2fsprogs, yq, unattended-upgrades\nDescription: OpenFrame management scripts\n Scripts for managing OpenFrame devices.\n' \
              "${version}" > "${PKG}/DEBIAN/control"

            dpkg-deb --build --root-owner-group "${PKG}"

            # To the testing suite: test units take it now, every other OpenFrame once it's
            # promoted ("promote" on the testing issue, promote.yml).
            bash ci/apt-suite.sh add "${codename}-testing" "${PKG}.deb"

            # What's new, for of-update and Sprite's Updates tab: the owners' notes for every
            # version (commits' News: trailers), beside the pool.
            mkdir -p apt-repo/news
            bash package/version.sh "${overlay_dir}" --news > apt-repo/news/openframe-scripts.news

            rm -rf "${PKG}"
          done

          # The public key for new systems: the shared one once the package ships it.
          gpg --export ${PUBLISH_KEY:-} > apt-repo/key.gpg

      - name: Generate directory listing
        run: bash ci/apt-suite.sh listing

      - name: Push apt repository
        run: |
          cd apt-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes to commit" || \
            git commit -m "apt: openframe-scripts $(git -C .. rev-parse --short HEAD), testing"
          git push origin repo

      # The testing issue: what test units have that other OpenFrames don't, for "promote".
      - name: Update the testing issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash ci/testing-issue.sh "openframe-scripts $(bash package/version.sh overlay-debian-trixie/) is in testing (${GITHUB_SHA::7})."
