name: package-build-publish
run-name: package build and publish

on:
  push:
    branches: [main]
    paths:
      - 'overlay-*/usr/local/bin/of-*'
      - 'overlay-*/usr/local/sbin/of-*'
      - 'overlay-*/usr/share/kernel/**'
      - 'overlay-*/usr/lib/firmware/updates/**'
      - 'overlay-*/usr/lib/udev/rules.d/**'
      - 'overlay-*/usr/lib/openframe/**'
      - 'overlay-*/usr/share/initramfs-tools/**'
      - 'overlay-*/usr/lib/systemd/system/**'
      - 'overlay-*/usr/lib/sysctl.d/**'
      - 'overlay-*/etc/dpkg/dpkg.cfg.d/openframe-*'
      - 'package/**'
      - '.github/workflows/package.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-package
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0    # the version counts this month's commits

      - name: Install tools
        run: sudo apt-get install -y apt-utils dpkg-dev

      - name: Ensure repo branch exists
        run: |
          git fetch origin repo:refs/remotes/origin/repo 2>/dev/null || \
            git push origin HEAD:repo

      - name: Checkout repo branch
        uses: actions/checkout@v7
        with:
          ref: repo
          path: apt-repo

      - name: Import GPG signing key
        run: echo "${{ secrets.APT_SIGNING_KEY }}" | gpg --batch --import

      - name: Build packages and apt repository
        run: |
          for overlay_dir in overlay-*/; do
            codename=$(basename "${overlay_dir}" | sed 's/overlay-[^-]*-//')

            # year.month.N (see package/version.sh, which the image build uses too).
            version=$(bash package/version.sh "${overlay_dir}")
            PKG="openframe-scripts_${version#*:}_all"

            mkdir -p "${PKG}/DEBIAN" "${PKG}/usr/local/bin" "${PKG}/usr/local/sbin"
            cp "${overlay_dir}usr/local/bin/of-"* "${PKG}/usr/local/bin/" 2>/dev/null || true
            cp "${overlay_dir}usr/local/sbin/of-"* "${PKG}/usr/local/sbin/" 2>/dev/null || true
            chmod 755 "${PKG}/usr/local/bin/"of-* "${PKG}/usr/local/sbin/"of-*

            # Kernel hooks: the kernel package runs /usr/share/kernel/*.d as well as /etc/kernel/*.d.
            mkdir -p "${PKG}/usr/share/kernel/preinst.d" "${PKG}/usr/share/kernel/postinst.d"
            cp "${overlay_dir}usr/share/kernel/preinst.d/"* "${PKG}/usr/share/kernel/preinst.d/"
            cp "${overlay_dir}usr/share/kernel/postinst.d/"* "${PKG}/usr/share/kernel/postinst.d/"
            chmod 755 "${PKG}/usr/share/kernel/preinst.d/"* "${PKG}/usr/share/kernel/postinst.d/"*

            # Firmware the built-in drivers list but Debian doesn't ship yet. Without it,
            # every initramfs rebuild warns "Possible missing firmware". The updates
            # directory doesn't clash with Debian's firmware packages.
            if [ -d "${overlay_dir}usr/lib/firmware/updates" ]; then
              mkdir -p "${PKG}/usr/lib/firmware"
              cp -R "${overlay_dir}usr/lib/firmware/updates" "${PKG}/usr/lib/firmware/"
              find "${PKG}/usr/lib/firmware" -type d -exec chmod 755 {} +
              find "${PKG}/usr/lib/firmware" -type f -exec chmod 644 {} +
            fi

            # udev rules the scripts rely on (70-of-eth0-up.rules runs of-netplan --early).
            if [ -d "${overlay_dir}usr/lib/udev/rules.d" ]; then
              mkdir -p "${PKG}/usr/lib/udev/rules.d"
              install -m 644 "${overlay_dir}usr/lib/udev/rules.d/"*.rules "${PKG}/usr/lib/udev/rules.d/"
            fi

            # BlwMac.efi, which of-bootnsh copies to /boot on BirdsLikeWires firmware.
            if [ -d "${overlay_dir}usr/lib/openframe" ]; then
              mkdir -p "${PKG}/usr/lib/openframe"
              for f in "${overlay_dir}usr/lib/openframe/"*; do
                [ -x "$f" ] && mode=755 || mode=644
                install -m "$mode" "$f" "${PKG}/usr/lib/openframe/"
              done
            fi

            # initramfs-tools settings for a small initrd: only the modules the root
            # filesystem needs (MODULES=list), and no udev hardware database. The trigger
            # has initramfs-tools rebuild the initrd once the package is installed.
            if [ -d "${overlay_dir}usr/share/initramfs-tools" ]; then
              mkdir -p "${PKG}/usr/share/initramfs-tools"
              cp -R "${overlay_dir}usr/share/initramfs-tools/." "${PKG}/usr/share/initramfs-tools/"
              find "${PKG}/usr/share/initramfs-tools" -type d -exec chmod 755 {} +
              find "${PKG}/usr/share/initramfs-tools" -type f -exec chmod 644 {} +
              chmod 755 "${PKG}/usr/share/initramfs-tools/hooks/"*
              install -m 644 package/triggers "${PKG}/DEBIAN/triggers"
            fi

            # Power-cut hardening: the service that finishes interrupted package operations,
            # a shorter writeback delay, and the dpkg hook that makes the read-only /boot
            # writable while dpkg runs (a conffile, so local changes are kept).
            if [ -d "${overlay_dir}usr/lib/systemd/system" ]; then
              mkdir -p "${PKG}/usr/lib/systemd/system"
              install -m 644 "${overlay_dir}usr/lib/systemd/system/"*.service "${PKG}/usr/lib/systemd/system/"
            fi
            if [ -d "${overlay_dir}usr/lib/sysctl.d" ]; then
              mkdir -p "${PKG}/usr/lib/sysctl.d"
              install -m 644 "${overlay_dir}usr/lib/sysctl.d/"*.conf "${PKG}/usr/lib/sysctl.d/"
            fi
            if [ -f "${overlay_dir}etc/dpkg/dpkg.cfg.d/openframe-boot" ]; then
              mkdir -p "${PKG}/etc/dpkg/dpkg.cfg.d"
              install -m 644 "${overlay_dir}etc/dpkg/dpkg.cfg.d/openframe-boot" "${PKG}/etc/dpkg/dpkg.cfg.d/"
              echo /etc/dpkg/dpkg.cfg.d/openframe-boot > "${PKG}/DEBIAN/conffiles"
            fi

            install -m 755 package/postinst "${PKG}/DEBIAN/postinst"

            printf 'Package: openframe-scripts\nVersion: %s\nArchitecture: all\nSection: admin\nPriority: optional\nMaintainer: OpenFrame <andy@dvsn.net>\nDepends: bash, dosfstools, e2fsprogs\nDescription: OpenFrame management scripts\n Scripts for managing OpenFrame devices.\n' \
              "${version}" > "${PKG}/DEBIAN/control"

            dpkg-deb --build --root-owner-group "${PKG}"

            mkdir -p "apt-repo/pool/${codename}"
            rm -f "apt-repo/pool/${codename}/"openframe-scripts_*.deb
            cp "${PKG}.deb" "apt-repo/pool/${codename}/"

            mkdir -p "apt-repo/dists/${codename}/main/binary-i386"
            cd apt-repo
            dpkg-scanpackages "pool/${codename}" > "dists/${codename}/main/binary-i386/Packages"
            gzip -kf "dists/${codename}/main/binary-i386/Packages"

            GPG_KEY_ID=$(gpg --list-keys --with-colons | awk -F: '/^pub/{print $5; exit}')
            apt-ftparchive \
              -o APT::FTPArchive::Release::Origin="OpenFrame" \
              -o APT::FTPArchive::Release::Label="OpenFrame Linux" \
              -o APT::FTPArchive::Release::Suite="${codename}" \
              -o APT::FTPArchive::Release::Codename="${codename}" \
              -o APT::FTPArchive::Release::Architectures="all i386" \
              -o APT::FTPArchive::Release::Components="main" \
              -o APT::FTPArchive::Release::Description="OpenFrame Linux packages" \
              release "dists/${codename}" > "dists/${codename}/Release"

            gpg --batch --yes --default-key "${GPG_KEY_ID}" \
              --detach-sign --armor -o "dists/${codename}/Release.gpg" "dists/${codename}/Release"
            gpg --batch --yes --default-key "${GPG_KEY_ID}" \
              --clearsign -o "dists/${codename}/InRelease" "dists/${codename}/Release"
            cd ..

            rm -rf "${PKG}"
          done

          gpg --export > apt-repo/key.gpg

      - name: Generate directory listing
        run: |
          cd apt-repo
          {
            printf '<!DOCTYPE html>\n<html>\n'
            printf '<head><title>Index of /</title></head>\n'
            printf '<body>\n<h1>Index of /</h1><hr><pre>'

            human_size() {
              local size=$1
              if [ "$size" -ge 1073741824 ]; then
                echo "$((size / 1073741824))G"
              elif [ "$size" -ge 1048576 ]; then
                echo "$((size / 1048576))M"
              elif [ "$size" -ge 1024 ]; then
                echo "$((size / 1024))K"
              else
                echo "$size"
              fi
            }

            for f in pool/*/*.deb; do
              [ -f "$f" ] || continue
              fname=$(basename "$f")
              fsize=$(stat -c '%s' "$f")
              fdate=$(date -d "@$(stat -c '%Y' "$f")" '+%d-%b-%Y %H:%M')
              hsize=$(human_size "$fsize")
              namelen=${#fname}
              padlen=$((51 - namelen))
              [ ${padlen} -lt 1 ] && padlen=1
              padding=$(printf '%*s' ${padlen} '')
              printf '\n<a href="%s">%s</a>%s%s  %8s' \
                "${f}" "${fname}" "${padding}" "${fdate}" "${hsize}"
            done

            printf '\n</pre><hr></body>\n</html>\n'
          } > index.html

      - name: Push apt repository
        run: |
          cd apt-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes to commit" || \
            git commit -m "apt: openframe-scripts $(git -C .. rev-parse --short HEAD)"
          git push origin repo
