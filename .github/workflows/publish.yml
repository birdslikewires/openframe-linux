name: image-publish
run-name: image publish from run ${{ inputs.run_id }}

# Publishes an image an earlier push build already made, as the GitHub Release for
# its kernel, replacing the image any release that kernel already has (the release itself stays). For when the image
# changes but the kernel version doesn't (the daily check only builds for a new
# kernel tag): test the build's artifact, then publish that same image instead of
# building another.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'The image-build-publish run whose image to publish (the number at the end of its URL)'
        required: true

permissions:
  contents: write
  actions: read

concurrency:
  group: build-image
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      RUN_ID: ${{ inputs.run_id }}

    steps:
      - name: Check the build
        id: run
        run: |
          read -r name conclusion branch event sha < <(gh run view "$RUN_ID" --repo "$REPO" \
            --json workflowName,conclusion,headBranch,event,headSha \
            --jq '[.workflowName, .conclusion, .headBranch, .event, .headSha] | @tsv')
          if [ "$name" != "image-build-publish" ] || [ "$conclusion" != "success" ] || [ "$branch" != "main" ]; then
            echo "Run $RUN_ID isn't a successful image build from main ($name, $conclusion, $branch)."
            exit 1
          fi
          if [ "$event" != "push" ]; then
            echo "Run $RUN_ID was started by $event; only push builds keep their image as an artifact."
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Download the image
        run: |
          gh run download "$RUN_ID" --repo "$REPO" --name openframe-trixie --dir image
          cd image
          md5sum -c *.img.gz.md5

      # Release files carry the kernel tag with its v (builds before 26.11 left it out),
      # and the check workflow finds the release by that tag.
      - name: Name the image after its kernel
        id: image
        run: |
          cd image
          img=$(ls *.img.gz)
          [ "$(echo "$img" | wc -l)" -eq 1 ] || { echo "Expected one image, found: $img"; exit 1; }
          base="${img%.img.gz}"
          # A push build names its image by its commit too (...-v6.18.63-eeff360): not the release.
          case "${base##*-}" in
            [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) base="${base%-*}" ;;
          esac
          version="${base##*-}"
          version="${version#v}"
          if ! echo "$version" | grep -qE '^[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
            echo "Can't find the kernel version in $img."
            exit 1
          fi
          tag="v$version"
          new="${base%-*}-$tag.img.gz"
          if [ "$new" != "$img" ]; then
            mv "$img" "$new"
            rm -f "$img.md5"
            md5sum "$new" > "$new.md5"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          ls -l

      # The release itself is never deleted: deleting it first, then failing to create or upload
      # its replacement, left no release for the kernel, and the daily check would then build and
      # publish a fresh, untested image in its place. So the new files go up beside the old under
      # temporary names (.new), the old ones go, the new ones take their names, and the notes and
      # the tag follow. A failure part way leaves the old image, or both; the release stays.
      - name: Replace the release
        env:
          TAG: ${{ steps.image.outputs.tag }}
          SHA: ${{ steps.run.outputs.sha }}
        run: |
          TITLE="OpenFrame Trixie $TAG"
          NOTES="Debian Trixie image built with kernel $TAG, from ${SHA:0:7} (build run $RUN_ID)."
          if ! gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            gh release create "$TAG" image/*.img.gz image/*.img.gz.md5 \
              --repo "$REPO" --target "$SHA" --title "$TITLE" --notes "$NOTES"
            exit 0
          fi
          echo "Replacing the $TAG release's image."
          mkdir -p staged
          for f in image/*.img.gz image/*.img.gz.md5; do cp "$f" "staged/${f##*/}.new"; done
          gh release upload "$TAG" staged/* --repo "$REPO" --clobber
          gh api "repos/$REPO/releases/tags/$TAG" --jq '.assets[] | "\(.id) \(.name)"' > assets.txt
          cat assets.txt
          # Every new file must be there before any old one goes.
          for f in staged/*; do
            grep -q " ${f##*/}\$" assets.txt || { echo "${f##*/} didn't upload; the release is as it was."; exit 1; }
          done
          while read -r id name; do
            case "$name" in *.new) ;; *) gh api -X DELETE "repos/$REPO/releases/assets/$id" < /dev/null ;; esac
          done < assets.txt
          while read -r id name; do
            case "$name" in *.new) gh api -X PATCH "repos/$REPO/releases/assets/$id" -f name="${name%.new}" < /dev/null > /dev/null ;; esac
          done < assets.txt
          gh release edit "$TAG" --repo "$REPO" --title "$TITLE" --notes "$NOTES"
          # The tag moves to the commit the image was built from.
          gh api -X PATCH "repos/$REPO/git/refs/tags/$TAG" -f sha="$SHA" -F force=true > /dev/null
          gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name'
