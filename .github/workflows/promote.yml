name: promote
run-name: release (ok) or keep back (no) what's waiting in testing

# Releases what's waiting in linux.openbeak.net's testing suite (openframe-scripts, Sprite,
# Crystal HD) to every OpenFrame: "ok" as the reply to the open testing issue
# (ci/testing-issue.sh keeps it), by Andy (vars.TESTING_ASSIGNEE, or andydvsn), moves every package in
# trixie-testing to trixie, where units take it overnight. "no" closes the issue and keeps
# them in testing; the next publish opens it again. Replies from anyone else, anything but ok or no, or on any other
# issue, do nothing. It can also be run by hand, which promotes.

on:
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: build-package
  cancel-in-progress: false

jobs:
  promote:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (!github.event.issue.pull_request && github.event.comment.user.login == (vars.TESTING_ASSIGNEE || 'andydvsn') &&
       contains(github.event.issue.labels.*.name, 'testing'))
    runs-on: ubuntu-latest

    steps:
      - name: Read the comment
        env:
          BODY: ${{ github.event.comment.body }}
          # the issue as it was when the reply was made (GitHub sends it with the reply)
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = workflow_dispatch ]; then
            echo "ACTION=promote" >> "$GITHUB_ENV"; exit 0
          fi
          # The whole comment must be "ok" (promote) or "no" (reject), whatever its case or
          # punctuation: "ok, I'll try it tomorrow" is just a comment.
          word=$(printf '%s' "$BODY" | tr 'A-Z' 'a-z' | tr -d '[:space:][:punct:]')
          # What the issue listed then, package=version: only that is released, so nothing that
          # reached testing after the issue was read goes out with it.
          listed=$(printf '%s\n' "$ISSUE_BODY" | awk -F'|' 'NF >= 5 { p = $2; v = $3; gsub(/[ `]/, "", p); gsub(/[ `]/, "", v)
            if (p != "" && p != "Package" && p !~ /^-+$/) print p "=" v }' | tr '\n' ' ')
          echo "LISTED=${listed}" >> "$GITHUB_ENV"
          echo "The issue listed: ${listed:-nothing}"
          case "$word" in
            ok) [ -n "$listed" ] || { echo "The issue listed nothing to release."; exit 1; }
                echo "ACTION=promote" >> "$GITHUB_ENV" ;;
            no) echo "ACTION=reject" >> "$GITHUB_ENV" ;;
            *) echo "Not ok or no on its own: nothing to do."; echo "ACTION=none" >> "$GITHUB_ENV" ;;
          esac

      - name: Checkout
        if: env.ACTION == 'promote'
        uses: actions/checkout@v7

      - name: Install tools
        if: env.ACTION == 'promote'
        run: sudo apt-get install -y apt-utils dpkg-dev

      - name: Checkout repo branch
        if: env.ACTION == 'promote'
        uses: actions/checkout@v7
        with:
          ref: repo
          path: apt-repo

      - name: Import GPG signing keys
        if: env.ACTION == 'promote'
        env:
          KEY: ${{ secrets.APT_SIGNING_KEY }}
          KEY_NEW: ${{ secrets.APT_SIGNING_KEY_OPENFRAME }}
        run: |
          echo "${KEY}" | gpg --batch --import
          [ -z "${KEY_NEW}" ] || echo "${KEY_NEW}" | gpg --batch --import
          SIGNERS=$(gpg --batch --with-colons --list-secret-keys | awk -F: '/^sec/ { s = 1; next } s && /^fpr/ { print $10; s = 0 }')
          for k in overlay-*/usr/share/keyrings/openframe-apt.gpg; do
            [ -f "$k" ] || continue
            SHIPPED=$(gpg --batch --with-colons --show-keys "$k" | awk -F: '/^pub/ { s = 1; next } s && /^fpr/ { print $10; s = 0 }')
            for f in ${SHIPPED}; do
              echo "${SIGNERS}" | grep -qx "$f" || { echo "$k holds $f, which this run doesn't sign with: not publishing."; exit 1; }
            done
          done
          echo "SIGN_ARGS=$(for f in ${SIGNERS}; do printf -- '--local-user %s! ' "$f"; done)" >> $GITHUB_ENV

      # Every package the released suite would then hold must install on an OpenFrame that isn't
      # a test unit (ci/promote-check.sh), so nothing goes out needing what's still in testing.
      - name: Check it all installs once promoted
        if: env.ACTION == 'promote'
        env:
          GH_TOKEN: ${{ github.token }}
          APT_SITE: linux.openbeak.net
        run: |
          # (LISTED is empty when run by hand: everything in testing)
          if ! bash ci/promote-check.sh ${LISTED} > check.txt 2>&1; then
            cat check.txt
            if [ -n "${{ github.event.issue.number }}" ]; then
              printf 'Not promoted: once promoted, not everything would install on an OpenFrame that isn'"'"'t a test unit.\n\n```\n%s\n```\n' \
                "$(tail -20 check.txt)" | gh issue comment "${{ github.event.issue.number }}" -R "${GITHUB_REPOSITORY}" --body-file -
            fi
            exit 1
          fi
          cat check.txt

      - name: Promote
        if: env.ACTION == 'promote'
        run: |
          bash ci/apt-suite.sh promote ${LISTED} | tee promoted.txt
          bash ci/apt-suite.sh listing
          cd apt-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes to commit" || \
            git commit -m "apt: promote $(grep -c '^promoted' ../promoted.txt) package(s) from testing"
          git push origin repo

      - name: Update the testing issue
        if: env.ACTION == 'promote'
        env:
          GH_TOKEN: ${{ github.token }}
          ASSIGNEE: ${{ vars.TESTING_ASSIGNEE || 'andydvsn' }}   # who's told (an organisation can't be)
        run: |
          list=$(sed -n 's/^promoted //p' promoted.txt | tr '\n' ',' | sed 's/,$//; s/,/, /g')
          bash ci/testing-issue.sh "Promoted to every OpenFrame: ${list:-nothing}."

      - name: Reject
        if: env.ACTION == 'reject'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue close "${{ github.event.issue.number }}" -R "${GITHUB_REPOSITORY}" \
            --comment "Kept in testing: other OpenFrames won't get these. The next publish opens this again."
