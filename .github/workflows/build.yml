name: image-build-publish
run-name: image build${{ inputs.kernel_version && (inputs.testing_kernel && format(' {0} (testing kernel)', inputs.kernel_version) || format(' and publish {0}', inputs.kernel_version)) || '' }}

on:
  push:
    branches: [main]
    paths:
      - 'overlay-*/**'
      - 'of-imgcreate.sh'
      - 'of-imgbundle.sh'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      kernel_version:
        description: 'Kernel release tag to build for (e.g. v6.18.60, the v is optional). If set, a GitHub Release will be created, unless the kernel is in testing.'
        required: false
        default: ''
      testing_kernel:
        description: 'The kernel is still in testing (check.yml, from a new kernel): no release, the image stays an artifact for 90 days, for promote'
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  actions: write    # to start sprite.yml (see "Wait for openframe-sprite")

concurrency:
  group: build-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
      options: --privileged
    env:
      # What the image installs from the repositories' testing suites (00-of-prep.sh): a push
      # build, or one started by hand with no kernel given, tests what's in testing, so
      # everything; an image for a kernel in testing, only that kernel, so promoting it later
      # releases nothing else that isn't promoted; a release, nothing.
      OF_TESTING: ${{ (github.event_name == 'push' || inputs.kernel_version == '') && 'all' || (inputs.testing_kernel && 'kernel' || '') }}
      # A GitHub release: a kernel given by hand, or by check.yml for a promoted kernel.
      RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.kernel_version != '' && !inputs.testing_kernel }}

    steps:
      # Before the checkout: without git in the container, it would download the files
      # without the history that gives openframe-scripts its version.
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y ca-certificates curl debootstrap dosfstools e2fsprogs git gh parted rsync

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0    # package/version.sh counts this month's commits

      - name: Get kernel version
        id: kernel
        run: |
          if [ -n "${INPUT_KERNEL_VERSION}" ]; then
            # Release tags need the v, as the check workflows look for them by that name.
            # Only a plain version goes on: the later steps put it into commands.
            version="${INPUT_KERNEL_VERSION}"
            # (This job's container runs steps with sh, not bash: grep, not [[ =~ ]].)
            if ! echo "${version}" | grep -qE '^v?[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
              echo "kernel_version isn't a version: '${version}'."
              exit 1
            fi
            echo "version=v${version#v}" >> $GITHUB_OUTPUT
          else
            version=$(gh release list --repo birdslikewires/openframe-kernel --limit 1 --json tagName --jq '.[0].tagName | ltrimstr("v")')
            if [ -z "$version" ]; then
              echo "Failed to get kernel version from openframe-kernel releases."
              exit 1
            fi
            if ! echo "${version}" | grep -qE '^[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
              echo "The kernel's latest release tag isn't a version: '${version}'."
              exit 1
            fi
            # With the v too, so a tested artifact has the release's file name.
            echo "version=v$version" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_KERNEL_VERSION: ${{ github.event.inputs.kernel_version }}

      # The kernel release is published before GitHub Pages has finished deploying
      # the apt repository. This requests the same URL as apt, so it also waits out
      # any stale CDN cache.
      - name: Wait for kernel in apt repository
        env:
          KERNEL_VERSION: ${{ steps.kernel.outputs.version }}
        run: |
          version="${KERNEL_VERSION#v}"
          branch=$(echo "$version" | cut -d. -f1-2)
          suites="trixie"
          [ -n "${OF_TESTING}" ] && suites="trixie trixie-testing"   # a kernel in testing
          for attempt in $(seq 1 90); do
            for suite in $suites; do
              url="https://kernel.openbeak.net/dists/${suite}/${branch}/binary-i386/Packages"
              if curl -fsSL "$url" 2>/dev/null | awk -v pkg="linux-image-openframe-${branch}" -v ver="$version" \
                '$1 == "Package:" { p = $2 } $1 == "Version:" && p == pkg && $2 == ver { found = 1 } END { exit !found }'; then
                echo "Kernel ${version} is available from the apt repository (${suite})."
                exit 0
              fi
            done
            echo "Waiting for kernel ${version} in the apt repository (attempt ${attempt}/90)..."
            sleep 30
          done
          echo "Kernel ${version} did not appear in the apt repository after 45 minutes."
          exit 1

      # The image installs openframe-scripts from the apt repository, over the overlay's
      # copies of its files. A push that changes the package starts the package workflow
      # alongside this one, so wait until the repository has this commit's version (or
      # a later one), or the image gets the previous version's scripts. In either suite:
      # a new version goes to testing first, and an image that installs only what's
      # released (for a kernel, in testing or promoted) mustn't wait for its promotion.
      - name: Wait for openframe-scripts in apt repository
        run: |
          # The checkout belongs to another user than the container's root, and the
          # exception actions/checkout makes for that doesn't outlast its own step.
          git config --global --add safe.directory "$PWD"
          version=$(bash package/version.sh overlay-debian-trixie/)
          url="https://linux.openbeak.net/dists/trixie/main/binary-i386/Packages"
          for attempt in $(seq 1 60); do
            published=$(curl -fsSL "$url" | awk '$1 == "Package:" { p = $2 } $1 == "Version:" && p == "openframe-scripts" { print $2; exit }')
            t=$(curl -fsSL "${url%/dists/*}/dists/trixie-testing/main/binary-i386/Packages" 2>/dev/null | awk '$1 == "Package:" { p = $2 } $1 == "Version:" && p == "openframe-scripts" { print $2; exit }')
            if [ -n "$t" ] && { [ -z "$published" ] || dpkg --compare-versions "$t" gt "$published"; }; then published="$t"; fi
            if [ -n "$published" ] && dpkg --compare-versions "$published" ge "$version"; then
              echo "openframe-scripts ${published} is available from the apt repository."
              exit 0
            fi
            echo "Waiting for openframe-scripts ${version} in the apt repository (it has ${published:-none}; attempt ${attempt}/60)..."
            sleep 30
          done
          echo "openframe-scripts ${version} did not appear in the apt repository after 30 minutes."
          exit 1

      # openframe-sprite is built in its own repository and brought into the apt repository by
      # sprite.yml (every three hours, or by hand), which the image installs it from: wait for
      # its latest release to be there. If it isn't, sprite.yml is started rather than waited
      # for. (It's in the build-package concurrency group, not this one, so it can run.) In
      # either suite, as openframe-scripts above.
      - name: Wait for openframe-sprite in apt repository
        run: |
          version=$(gh release view --repo birdslikewires/openframe-sprite --json tagName --jq '.tagName | ltrimstr("v")')
          if ! echo "${version}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "openframe-sprite's latest release tag isn't a version: '${version}'."
            exit 1
          fi
          url="https://linux.openbeak.net/dists/trixie/main/binary-i386/Packages"
          for attempt in $(seq 1 60); do
            published=$(curl -fsSL "$url" | awk '$1 == "Package:" { p = $2 } $1 == "Version:" && p == "openframe-sprite" { print $2; exit }')
            t=$(curl -fsSL "${url%/dists/*}/dists/trixie-testing/main/binary-i386/Packages" 2>/dev/null | awk '$1 == "Package:" { p = $2 } $1 == "Version:" && p == "openframe-sprite" { print $2; exit }')
            if [ -n "$t" ] && { [ -z "$published" ] || dpkg --compare-versions "$t" gt "$published"; }; then published="$t"; fi
            if [ -n "$published" ] && dpkg --compare-versions "$published" ge "$version"; then
              echo "openframe-sprite ${published} is available from the apt repository."
              exit 0
            fi
            if [ "$attempt" -eq 1 ]; then
              echo "Starting sprite.yml to bring openframe-sprite ${version} in."
              gh workflow run sprite.yml --repo "${GITHUB_REPOSITORY}" || echo "Couldn't start sprite.yml: waiting for its next scheduled run."
            fi
            echo "Waiting for openframe-sprite ${version} in the apt repository (it has ${published:-none}; attempt ${attempt}/60)..."
            sleep 30
          done
          echo "openframe-sprite ${version} did not appear in the apt repository after 30 minutes."
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        env:
          KERNEL_VERSION: ${{ steps.kernel.outputs.version }}
        run: |
          ./of-imgcreate.sh of ext4 uni 46 "debian trixie" \
            ./overlay-debian-trixie "" \
            http://deb.debian.org/debian

      - name: Add kernel version to image filename
        run: |
          img=$(ls *.img)
          mv "$img" "${img%.img}-${{ steps.kernel.outputs.version }}.img"

      # A compressed copy of the image inside its own root filesystem, which OpenFrame
      # Flash (of-flash) writes to an OpenFrame 1's internal memory: one download is both
      # the system and its flash stick, and flashing needs no network.
      - name: Bundle a copy for installing to internal memory
        run: |
          img=$(ls *.img)
          ./of-imgbundle.sh "$img"

      - name: Compress and checksum
        run: |
          img=$(ls *.img)
          gzip "$img"
          md5sum "${img}.gz" > "${img}.gz.md5"

      # An image that isn't published (a push build's artifact) carries its commit in its
      # name too, so it can't be mistaken for the release's (which has the same kernel and so
      # the same name): of-ext4-...-v6.18.63-eeff360.img.gz. Only the file's name: the image
      # inside is as built. publish.yml drops the commit again when it publishes one.
      - name: Name the artifact by its commit
        if: env.RELEASE != 'true'
        run: |
          sha=$(echo "${GITHUB_SHA}" | cut -c1-7)
          img=$(ls *.img.gz)
          new="${img%.img.gz}-${sha}.img.gz"
          mv "$img" "$new"
          rm -f "$img.md5"
          md5sum "$new" > "$new.md5"
          ls -l

      - name: Upload image artifact
        if: env.RELEASE != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: openframe-trixie
          path: |
            *.img.gz
            *.md5
          # an image for a kernel in testing waits for promote (publish.yml), however long it takes
          retention-days: ${{ inputs.testing_kernel && 90 || 14 }}

      - name: Create GitHub Release
        if: env.RELEASE == 'true'
        run: |
          gh release create "${{ steps.kernel.outputs.version }}" \
            --repo ${{ github.repository }} \
            --title "OpenFrame Trixie ${{ steps.kernel.outputs.version }}" \
            --notes "Debian Trixie image built with kernel ${{ steps.kernel.outputs.version }}." \
            *.img.gz *.md5
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete old GitHub releases and tags
        if: env.RELEASE == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --repo ${{ github.repository }} --limit 100 --json tagName \
            --jq '.[3:][].tagName' | while read -r tag; do
            gh release delete "$tag" --repo ${{ github.repository }} --yes --cleanup-tag
          done
