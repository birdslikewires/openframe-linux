name: image-build-publish
run-name: image build${{ inputs.kernel_version && format(' and publish {0}', inputs.kernel_version) || '' }}

on:
  push:
    branches: [main]
    paths:
      - 'overlay-*/**'
      - 'of-imgcreate.sh'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      kernel_version:
        description: 'Kernel release tag to build for (e.g. v6.18.60, the v is optional). If set, a GitHub Release will be created.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: build-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
      options: --privileged

    steps:
      # Before the checkout: without git in the container, it would download the files
      # without the history that gives openframe-scripts its version.
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y ca-certificates curl debootstrap dosfstools e2fsprogs git gh parted rsync

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0    # package/version.sh counts this month's commits

      - name: Get kernel version
        id: kernel
        run: |
          if [ -n "${{ github.event.inputs.kernel_version }}" ]; then
            # Release tags need the v, as the check workflows look for them by that name.
            version="${{ github.event.inputs.kernel_version }}"
            echo "version=v${version#v}" >> $GITHUB_OUTPUT
          else
            version=$(gh release list --repo birdslikewires/openframe-kernel --limit 1 --json tagName --jq '.[0].tagName | ltrimstr("v")')
            if [ -z "$version" ]; then
              echo "Failed to get kernel version from openframe-kernel releases."
              exit 1
            fi
            # With the v too, so a tested artifact has the release's file name.
            echo "version=v$version" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The kernel release is published before GitHub Pages has finished deploying
      # the apt repository. This requests the same URL as apt, so it also waits out
      # any stale CDN cache.
      - name: Wait for kernel in apt repository
        env:
          KERNEL_VERSION: ${{ steps.kernel.outputs.version }}
        run: |
          version="${KERNEL_VERSION#v}"
          branch=$(echo "$version" | cut -d. -f1-2)
          url="https://kernel.openbeak.net/dists/trixie/${branch}/binary-i386/Packages"
          for attempt in $(seq 1 90); do
            if curl -fsSL "$url" | awk -v pkg="linux-image-openframe-${branch}" -v ver="$version" \
              '$1 == "Package:" { p = $2 } $1 == "Version:" && p == pkg && $2 == ver { found = 1 } END { exit !found }'; then
              echo "Kernel ${version} is available from the apt repository."
              exit 0
            fi
            echo "Waiting for kernel ${version} in the apt repository (attempt ${attempt}/90)..."
            sleep 30
          done
          echo "Kernel ${version} did not appear in the apt repository after 45 minutes."
          exit 1

      # The image installs openframe-scripts from the apt repository, over the overlay's
      # copies of its files. A push that changes the package starts the package workflow
      # alongside this one, so wait until the repository has this commit's version (or
      # a later one), or the image gets the previous version's scripts.
      - name: Wait for openframe-scripts in apt repository
        run: |
          version=$(bash package/version.sh overlay-debian-trixie/)
          url="https://linux.openbeak.net/dists/trixie/main/binary-i386/Packages"
          for attempt in $(seq 1 60); do
            published=$(curl -fsSL "$url" | awk '$1 == "Package:" { p = $2 } $1 == "Version:" && p == "openframe-scripts" { print $2; exit }')
            if [ -n "$published" ] && dpkg --compare-versions "$published" ge "$version"; then
              echo "openframe-scripts ${published} is available from the apt repository."
              exit 0
            fi
            echo "Waiting for openframe-scripts ${version} in the apt repository (it has ${published:-none}; attempt ${attempt}/60)..."
            sleep 30
          done
          echo "openframe-scripts ${version} did not appear in the apt repository after 30 minutes."
          exit 1

      - name: Build image
        env:
          KERNEL_VERSION: ${{ steps.kernel.outputs.version }}
        run: |
          ./of-imgcreate.sh of ext4 uni 46 "debian trixie" \
            ./overlay-debian-trixie "" \
            http://deb.debian.org/debian

      - name: Add kernel version to image filename
        run: |
          img=$(ls *.img)
          mv "$img" "${img%.img}-${{ steps.kernel.outputs.version }}.img"

      - name: Compress and checksum
        run: |
          img=$(ls *.img)
          gzip "$img"
          md5sum "${img}.gz" > "${img}.gz.md5"

      - name: Upload image artifact
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.kernel_version == ''
        uses: actions/upload-artifact@v7
        with:
          name: openframe-trixie
          path: |
            *.img.gz
            *.md5
          retention-days: 14

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.kernel_version != ''
        run: |
          gh release create "${{ steps.kernel.outputs.version }}" \
            --repo ${{ github.repository }} \
            --title "OpenFrame Trixie ${{ steps.kernel.outputs.version }}" \
            --notes "Debian Trixie image built with kernel ${{ steps.kernel.outputs.version }}." \
            *.img.gz *.md5
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete old GitHub releases and tags
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.kernel_version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --repo ${{ github.repository }} --limit 100 --json tagName \
            --jq '.[3:][].tagName' | while read -r tag; do
            gh release delete "$tag" --repo ${{ github.repository }} --yes --cleanup-tag
          done
