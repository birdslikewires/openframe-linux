# The SSH server starts only once someone could log in: a new unit's "of" has no password
# until one is set (OF-BOOT/settings/ssh.txt, or sprite's Settings, which starts the server
# then), so it doesn't listen with no way in. Units with a password or key start it as ever.
# A false condition skips the server without counting as a failure.
[Service]
ExecCondition=/usr/lib/openframe/ssh-settings check
