# X takes VT1, so it starts once the boot splash has gone (held by of-mac-gate while the
# MAC is settled): Plymouth quitting under a starting X server kills it ("Switching VT
# failed"). startx.service ('of-settings autoxinit') already starts before getty@tty1.
[Unit]
After=of-mac-gate.service plymouth-quit.service plymouth-quit-wait.service
