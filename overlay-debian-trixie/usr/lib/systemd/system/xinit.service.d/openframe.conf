# X takes VT1, so it starts once the boot splash has gone and the tty1 login prompt is
# up (both held by of-mac-gate while the MAC is settled), never in the middle of either:
# Plymouth quitting or getty opening tty1 under a starting X server kills it ("Switching
# VT failed"). xinit.service is what older 'of-settings autoxinit' wrote.
[Unit]
After=of-mac-gate.service plymouth-quit.service plymouth-quit-wait.service getty@tty1.service
