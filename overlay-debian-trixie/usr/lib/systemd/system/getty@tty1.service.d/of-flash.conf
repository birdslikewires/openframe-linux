# When OpenFrame Flash stops with a message for the person at the screen, the login prompt
# stays away so the message stays up (/run/of-flash/hold; SSH still works). A unit
# condition, not an ExecCondition: getty@ resets the console as its service ends
# (TTYVTDisallocate), which a failed ExecCondition counts as, and cleared the message
# five seconds after it appeared. A unit condition skips the start before any of that.
[Unit]
ConditionPathExists=!/run/of-flash/hold
