# OpenFrame: retry the time servers after 5 seconds, not 30. At boot timesyncd tries the
# Debian pool before DNS works, every attempt fails, and each network change while the
# network comes up restarts its retry wait; with the default 30 s the clock was set
# (and boot counted as finished, of-provision waits for it) about 30 s after the
# network was ready. Measured on an OpenFrame 1: boot finished at 46 s, now 16 s.
# A setting in /etc/systemd/timesyncd.conf(.d) still wins.
[Time]
ConnectionRetrySec=5
