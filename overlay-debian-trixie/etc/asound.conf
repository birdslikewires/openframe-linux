# Written by of-audio from OF-BOOT/settings/audio.txt: it's replaced when that changes.
# (An asound.conf of your own: take this line out, and of-audio leaves it alone.)
# Until of-audio has looked at the cards (as the system starts): the first, mixed.
pcm.mixer {
	type dmix
	ipc_key 3141
	ipc_key_add_uid false
	ipc_perm 0666
	slave {
		pcm "hw:0"
		channels 2
	}
	bindings {
		0 0
		1 1
	}
}
pcm.!default {
	type plug
	slave.pcm "mixer"
}
ctl.!default {
	type hw
	card 0
}
