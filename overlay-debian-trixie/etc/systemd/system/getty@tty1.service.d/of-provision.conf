# Leave tty1 free only when of-provision is running on this boot: it's enabled, or has
# already started (it disables itself as it starts), and there's a setup.txt in the boot
# volume's settings folder or its root. Using Conflicts= in of-provision.service would
# drop the getty on every boot, because conflicts are resolved before the setup.txt
# condition is checked. Conditions can't say "either of two files", so it's a check
# that skips the getty the same way. The getty is Type=idle, so the check can run some
# seconds after of-provision has started and disabled itself: hence its own note in /run.
[Service]
ExecCondition=/bin/sh -c '{ [ -e /etc/systemd/system/multi-user.target.wants/of-provision.service ] || [ -e /run/of-provision/started ]; } && { [ -e /boot/settings/setup.txt ] || [ -e /boot/setup.txt ]; } && exit 1; exit 0'
