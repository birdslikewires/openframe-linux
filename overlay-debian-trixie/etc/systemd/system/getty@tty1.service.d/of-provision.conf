# Leave tty1 free only when of-provision is running on this boot: it's enabled, or has
# already started (it disables itself as it starts), and there's a project to install
# in setup.txt ('of-provision --check': the images ship a setup.txt with none set, and
# a flash stick's is for the unit it installs). Using Conflicts= in
# of-provision.service would drop the getty on every boot, because conflicts are
# resolved before any condition is checked. The getty is Type=idle, so the check can
# run some seconds after of-provision has started and disabled itself: hence its own
# note in /run.
[Service]
ExecCondition=/bin/sh -c '{ [ -e /etc/systemd/system/multi-user.target.wants/of-provision.service ] || [ -e /run/of-provision/started ]; } && /usr/local/sbin/of-provision --check && exit 1; exit 0'
