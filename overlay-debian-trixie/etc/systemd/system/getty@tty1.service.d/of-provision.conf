# Leave tty1 free only when of-provision is going to run on this boot. Using
# Conflicts= in of-provision.service would drop the getty on every boot, because
# conflicts are resolved before the setup.txt condition is checked.
[Unit]
ConditionPathExists=|!/boot/setup.txt
ConditionPathExists=|!/etc/systemd/system/multi-user.target.wants/of-provision.service
