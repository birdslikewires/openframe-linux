# OpenFrame: names for the temperature readings 'sensors' shows (lm-sensors). Labels
# only: nothing is written to the chips. The JC42's limits are never set (they read
# 0 C), which 'sensors' would show as an alarm, so they're left out. Which part of the
# board the TMP421's remote probe measures isn't known; it reads the warmest.
chip "tmp421-*"
    label temp1 "Board (TMP421)"
    label temp2 "Remote probe (TMP421)"
chip "jc42-*"
    label temp1 "Memory (JC42)"
    ignore temp1_min
    ignore temp1_max
    ignore temp1_crit
    ignore temp1_min_alarm
    ignore temp1_max_alarm
    ignore temp1_crit_alarm
    ignore temp1_max_hyst
    ignore temp1_crit_hyst
chip "acpitz-*"
    label temp1 "ACPI zone"
